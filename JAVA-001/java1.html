<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>Preencha o formulário para o cadastro</p>

    <div>
        <form id="simplesform" onsubmit="return validateForm()">
            <fieldset>
                <h2>Cadastro</h2>

                <label for="nome">Nome:</label><br>
                <input type="text" name="nome" id="nome" required><br><br>

                <label for="email">E-mail:</label><br>
                <input type="email" name="email" id="email" required><br><br>

                <label for="senha">Senha:</label><br>
                <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required><br><br>

                <label for="confirmesenha">Confirme a Senha:</label><br>
                <input type="password" name="confirmesenha" id="confirmesenha" placeholder="Confirme sua senha" required><br><br>

                <button type="submit">Cadastrar</button>

                <p id="error-message"></p>
            </fieldset>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
